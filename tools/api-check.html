<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flights – API check</title>
  <style>
    body { margin: 0; padding: 12px max(12px, env(safe-area-inset-right)) 40px max(12px, env(safe-area-inset-left));
           font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .muted { color: #666; }
    button { min-height: 44px; padding: 0 16px; margin: 8px 8px 8px 0; font-size: 16px; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin: 10px 0; }
    .card h2 { font-size: 15px; margin: 0 0 4px; }
    .url { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; color: #666; }
    .ok { color: #0a7d2c; font-weight: 600; }
    .bad { color: #c62828; font-weight: 600; }
    .wait { color: #a66b00; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; max-height: 240px; overflow: auto;
          background: #f4f4f4; padding: 6px; border-radius: 4px; }
    textarea { width: 100%; height: 160px; font: 12px ui-monospace, Menlo, monospace; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #ddd; } .card { border-color: #444; }
      pre { background: #222; } .muted, .url { color: #999; }
    }
  </style>
</head>
<body>
  <h1>API check</h1>
  <div class="muted" id="env"></div>
  <button id="run">Run all checks</button>
  <button id="copy" disabled>Copy results</button>
  <div id="results"></div>
  <h2 style="font-size:15px">Results (paste into PROGRESS.md)</h2>
  <textarea id="summary" readonly></textarea>
  <script type="module" src="api-check.js"></script>
</body>
</html>
