<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flights</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Flights" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
        integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
        integrity="sha256-YSWCMtmNZNwqex4CEw1nQhvFub2lmU7vcCKP+XVwwXA=" crossorigin="" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- Start-up speed: open connections early and fetch every module in parallel instead of one import level at a time.
       Keep this list in sync with the imports (tests/preload.test.mjs checks it). -->
  <link rel="preconnect" href="https://flights-proxy.zkriaris.workers.dev" crossorigin />
  <link rel="preconnect" href="https://tile.openstreetmap.org" />
  <link rel="modulepreload" href="js/aircraft-layer.js" />
  <link rel="modulepreload" href="js/aircraft-panel.js" />
  <link rel="modulepreload" href="js/airlines.js" />
  <link rel="modulepreload" href="js/airport-layer.js" />
  <link rel="modulepreload" href="js/airport-panel.js" />
  <link rel="modulepreload" href="js/airport-traffic.js" />
  <link rel="modulepreload" href="js/alerts.js" />
  <link rel="modulepreload" href="js/altitude.js" />
  <link rel="modulepreload" href="js/api.js" />
  <link rel="modulepreload" href="js/atc.js" />
  <link rel="modulepreload" href="js/flight-times.js" />
  <link rel="modulepreload" href="js/forecast.js" />
  <link rel="modulepreload" href="js/geo.js" />
  <link rel="modulepreload" href="js/glide.js" />
  <link rel="modulepreload" href="js/layers.js" />
  <link rel="modulepreload" href="js/localtime.js" />
  <link rel="modulepreload" href="js/main.js" />
  <link rel="modulepreload" href="js/map.js" />
  <link rel="modulepreload" href="js/metar.js" />
  <link rel="modulepreload" href="js/panel.js" />
  <link rel="modulepreload" href="js/plane-icon.js" />
  <link rel="modulepreload" href="js/progress-bar.js" />
  <link rel="modulepreload" href="js/progress.js" />
  <link rel="modulepreload" href="js/refresh.js" />
  <link rel="modulepreload" href="js/search.js" />
  <link rel="modulepreload" href="js/share.js" />
  <link rel="modulepreload" href="js/status.js" />
  <link rel="modulepreload" href="js/storage.js" />
  <link rel="modulepreload" href="js/theme.js" />
  <link rel="modulepreload" href="js/track.js" />
  <link rel="modulepreload" href="js/traffic.js" />
  <link rel="modulepreload" href="js/transport.js" />
  <link rel="modulepreload" href="js/webcams.js" />
</head>
<body>
  <div id="map" aria-label="Map"></div>

  <header id="topbar">
    <div id="searchrow">
      <input id="search" type="search" placeholder="Search flight or airport"
             autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Search" />
      <button id="refresh" type="button" aria-label="Refresh data (hold to reload the page)">↻</button>
    </div>
    <div id="updated" role="status">Loading…</div>
    <ul id="suggestions" hidden></ul>
    <div id="alerts" hidden></div>
    <div id="status" hidden role="status"></div>
  </header>

  <aside id="panel" hidden>
    <div class="sheet-handle" role="button" tabindex="0" aria-label="Expand or collapse panel"></div>
    <div id="panel-content" aria-live="polite"></div>
  </aside>

  <footer id="disclaimer">
    Data from <a href="https://adsb.fi/" target="_blank" rel="noopener">adsb.fi</a>, <a href="https://adsb.lol/" target="_blank" rel="noopener">adsb.lol</a>, <a href="https://airplanes.live/" target="_blank" rel="noopener">airplanes.live</a> and <a href="https://opensky-network.org/" target="_blank" rel="noopener">The OpenSky Network</a>. Coverage has gaps. Not for operational use.
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
          integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin=""></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
